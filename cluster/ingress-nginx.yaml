# Valores del Ingress controller (compartido por todos los entornos).
# Defaults del chart: https://github.com/kubernetes/ingress-nginx/blob/main/charts/ingress-nginx/values.yaml
controller:
  ingressClassResource:
    name: nginx           # el className que usan nuestros Ingress
  service:
    # NodePort fijo 30080: minikube se creó con "--ports=127.0.0.1:8080:30080",
    # así que localhost:8080 llega aquí sin port-forward.
    # (En la nube sería type: LoadBalancer.)
    type: NodePort
    nodePorts:
      http: 30080
