# Ingress: reglas para que el tráfico HTTP de fuera llegue a un Service.
# Lo ejecuta un "Ingress controller" (aquí nginx, el addon de minikube),
# que reparte cada petición HTTP entre los pods del Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
spec:
  ingressClassName: nginx         # qué controlador lo atiende
  rules:
    - http:                       # sin "host": acepta cualquier dominio (localhost incluido)
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello       # nuestro Service
                port:
                  number: 80
