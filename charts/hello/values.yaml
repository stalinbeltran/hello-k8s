# Valores por defecto. Se pueden sobrescribir con:
#   helm install ... --set replicaCount=5
#   helm install ... -f mis-valores.yaml

replicaCount: 3

image:
  repository: hello-k8s
  tag: ""                 # vacío = usa appVersion de Chart.yaml
  pullPolicy: IfNotPresent

greeting: "Hola desde Helm!"

service:
  type: NodePort
  port: 80
  nodePort: 30080         # solo aplica si type=NodePort

ingress:
  enabled: true
  className: nginx
  host: ""                # vacío = acepta cualquier dominio; ej. "dev.localhost"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

rollout:
  minReadySeconds: 15
  maxSurge: 1
  maxUnavailable: 0
